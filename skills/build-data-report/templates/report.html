<style>
  /* Tokens. Every colour on the page is one of these, so light and dark swap in one place. */
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e3e2de;
    --grid: #ecebe7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77766f;
    --accent: #256abf;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #6250d6;
    --good: #0f7a3d;
    --bad: #c2332f;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border: #2e2e2b;
      --grid: #262624;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #9a998f;
      --accent: #6da7ec;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #9085e9;
      --good: #4cc27c;
      --bad: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #2e2e2b;
    --grid: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #9a998f;
    --accent: #6da7ec;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #9085e9;
    --good: #4cc27c;
    --bad: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1040px; margin: 0 auto; padding: 40px 16px 56px; display: grid; gap: 24px; }
  .num { font-variant-numeric: tabular-nums; }

  .masthead { display: grid; gap: 8px; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; font-weight: 680; letter-spacing: -.015em; text-wrap: balance; }
  .lede { margin: 0; max-width: 68ch; font-size: 17px; color: var(--text-secondary); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-1); color: var(--text-secondary); }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
  .badge[data-mode="live"]::before { background: var(--good); }
  .badge[data-mode="error"]::before { background: var(--bad); }

  button, .menu > summary {
    font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer;
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1);
  }
  button:hover, .menu > summary:hover { border-color: var(--text-muted); }
  button:focus-visible, .menu > summary:focus-visible, .menu a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: progress; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .kpi { padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); display: grid; gap: 2px; }
  .kpi-label { font-size: 13px; color: var(--text-secondary); }
  .kpi-value { font-size: 28px; font-weight: 650; letter-spacing: -.01em; }
  .kpi-note { font-size: 12px; color: var(--text-muted); }

  .figure { margin: 0; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); display: grid; gap: 12px; min-width: 0; }
  .figure-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; }
  .figure-head > div:first-child { flex: 1 1 260px; min-width: 0; }
  .figure h2 { margin: 0; font-size: 17px; font-weight: 640; }
  .figure-sub { margin: 2px 0 0; font-size: 13px; color: var(--text-secondary); }
  .figure-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .chips button { border: 0; border-radius: 0; padding: 4px 10px; }
  .chips button + button { border-left: 1px solid var(--border); }
  .chips button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
  .chart { width: 100%; height: 340px; }
  .figure figcaption { font-size: 12px; color: var(--text-muted); }

  .menu { position: relative; }
  .menu > summary { list-style: none; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu-list { position: absolute; right: 0; z-index: 10; margin-top: 6px; min-width: 230px; padding: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); box-shadow: 0 8px 24px rgb(0 0 0 / .12); display: grid; }
  .menu-list a { padding: 7px 10px; border-radius: 6px; color: var(--text-primary); text-decoration: none; font-size: 13px; }
  .menu-list a:hover { background: var(--surface-0); }
  .menu-sep { padding: 6px 10px 2px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--border); margin-top: 4px; }
  .menu-sep:first-child { border-top: 0; margin-top: 0; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--text-secondary); border-bottom-color: var(--border); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }

  .method { display: grid; gap: 10px; padding-top: 8px; }
  .method h2 { margin: 0; font-size: 17px; }
  .method p { margin: 0; color: var(--text-secondary); max-width: 75ch; }
  details.sql > summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); }
  pre { margin: 8px 0 0; padding: 12px; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-0); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  footer p { margin: 0; }
  a { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: var(--text-primary); color: var(--surface-1); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }

  <footer id="footer"></footer>
</main>

/* Words the page itself prints. Translate these with the report for another language. */
const UI = {
  embedded: (d) => 'Embedded data · as of ' + d,
  live: (t) => 'Live from the lakehouse · ' + t,
  refreshing: 'Querying the lakehouse…',
  unreachable: 'This viewer cannot reach the data bucket, so the embedded figures stay. They are correct as of the date shown.',
  data: 'Data',
  query: 'Query',
  openQuery: 'Open the query in the playground',
  copySql: 'Copy SQL',
  download: (n) => 'Download · ' + n + ' rows',
  copied: 'Copied',
  downloadBlocked: 'This viewer blocks downloads, so the file was copied to the clipboard instead',
  methodTitle: 'Method and sources',
  sqlFor: (t) => 'SQL for “' + t + '”',
  sourceLine: (s) => s.name + ' — ' + SITE + '/datasets/' + s.dataset,
  footer: (d) => 'Built from Date deschise, Romanian open data queried with DuckDB. Data as of ' + d + '. Query links point at ' + SITE + '.',
};

/* ===========================================================================
 * 3. RENDERING — generic. Edit only to add a chart kind.
 * ========================================================================= */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const figureById = (id) => REPORT.figures.find((f) => f.id === id);

function fmt(value, { digits = 0, style = 'decimal' } = {}) {
  if (value === null || value === undefined || value === '') return '—';
  if (typeof value !== 'number') return String(value);
  const options = style === 'percent'
    ? { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: 'exceptZero' }
    : { minimumFractionDigits: digits, maximumFractionDigits: digits };
  return new Intl.NumberFormat(REPORT.locale, options).format(value);
}

function playgroundUrl(sql) {
  return SITE + '/playground?sql=' + encodeURIComponent(sql.trim());
}

function renderHeader() {
  document.documentElement.lang = REPORT.lang;
  $('eyebrow').textContent = REPORT.eyebrow;
  $('title').textContent = REPORT.title;
  $('lede').textContent = REPORT.lede;
  setMode('embedded', UI.embedded(REPORT.asOf));
  $('refresh').hidden = !REPORT.live;
}

function setMode(mode, text) {
  $('mode').dataset.mode = mode;
  $('mode').textContent = text;
}

function renderKpis() {
  $('kpis').innerHTML = REPORT.kpis.map((k) => {
    const rows = figureById(k.from).rows;
    return '<div class="kpi"><span class="kpi-label">' + esc(k.label) + '</span>' +
      '<span class="kpi-value num">' + esc(fmt(k.value(rows), k)) + '</span>' +
      '<span class="kpi-note">' + esc(k.note ? k.note(rows) : '') + '</span></div>';
  }).join('');
}

function figureShell(f) {
  const chips = (f.ranges || []).map((r, i) =>
    '<button type="button" data-range="' + i + '" aria-pressed="' + (i === f.ranges.length - 1) + '">' + esc(r.label) + '</button>').join('');
  return '<figure class="figure" id="fig-' + f.id + '">' +
    '<div class="figure-head"><div><h2>' + esc(f.title) + '</h2>' +
    (f.subtitle ? '<p class="figure-sub">' + esc(f.subtitle) + '</p>' : '') + '</div>' +
    '<div class="figure-tools">' + (chips ? '<div class="chips" role="group">' + chips + '</div>' : '') +
    '<details class="menu"><summary aria-haspopup="menu">' + UI.data + ' ▾</summary><div class="menu-list" role="menu">' +
    '<div class="menu-sep">' + UI.query + '</div>' +
    '<a role="menuitem" href="' + esc(playgroundUrl(f.sql)) + '" target="_blank" rel="noopener">' + UI.openQuery + '</a>' +
    '<a role="menuitem" href="#" data-act="sql">' + UI.copySql + '</a>' +
    '<div class="menu-sep" data-count></div>' +
    '<a role="menuitem" href="#" data-act="csv">CSV</a>' +
    '<a role="menuitem" href="#" data-act="json">JSON</a>' +
    '</div></details></div></div>' +
    (f.kind === 'table'
      ? '<div class="table-wrap" data-body></div>'
      : '<div class="chart" data-body role="img" aria-label="' + esc(f.title + '. ' + (f.caption || '')) + '"></div>') +
    (f.caption ? '<figcaption>' + esc(f.caption) + '</figcaption>' : '') +
    '</figure>';
}

const charts = new Map();

function renderFigure(f) {
  const el = $('fig-' + f.id);
  el.querySelector('[data-count]').textContent = UI.download(f.rows.length);
  const body = el.querySelector('[data-body]');
  if (f.kind === 'table') {
    body.innerHTML = tableHtml(f);
    return;
  }
  const chart = charts.get(f.id) || echarts.init(body, null, { renderer: 'svg' });
  charts.set(f.id, chart);
  chart.setOption(f.kind === 'bar' ? barOption(f) : lineOption(f), true);
}

function visibleRows(f) {
  const range = f.ranges && f.ranges[f.rangeIndex ?? f.ranges.length - 1];
  return range && range.last ? f.rows.slice(-range.last) : f.rows;
}

function axisStyle() {
  return {
    axisLine: { lineStyle: { color: token('--border') } },
    axisTick: { show: false },
    axisLabel: { color: token('--text-muted'), fontSize: 11 },
    splitLine: { lineStyle: { color: token('--grid'), type: 'solid' } },
  };
}

function tooltipStyle() {
  return {
    backgroundColor: token('--surface-1'),
    borderColor: token('--border'),
    textStyle: { color: token('--text-primary'), fontSize: 12 },
  };
}

function lineOption(f) {
  const rows = visibleRows(f);
  const many = f.series.length > 1;
  return {
    animation: false,
    textStyle: { fontFamily: getComputedStyle(document.body).fontFamily },
    grid: { left: 8, right: many ? 104 : 24, top: many ? 36 : 12, bottom: 8, containLabel: true },
    legend: many ? { top: 0, left: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 4, textStyle: { color: token('--text-secondary') } } : undefined,
    tooltip: {
      trigger: 'axis', ...tooltipStyle(),
      axisPointer: { type: 'line', lineStyle: { color: token('--text-muted') } },
      valueFormatter: (v) => fmt(v, f),
    },
    xAxis: { type: 'category', data: rows.map((r) => r[f.x]), boundaryGap: false, ...axisStyle(), splitLine: { show: false } },
    yAxis: { type: 'value', scale: true, ...axisStyle(), axisLabel: { ...axisStyle().axisLabel, formatter: (v) => fmt(v, { digits: Math.min(f.digits ?? 0, 2) }) } },
    series: f.series.map((s, i) => ({
      name: s.label,
      type: 'line',
      data: rows.map((r) => r[s.key]),
      showSymbol: false,
      lineStyle: { width: 2 },
      color: token('--series-' + (i + 1)),
      emphasis: { focus: 'series' },
      endLabel: many ? { show: true, color: token('--text-secondary'), fontSize: 11, formatter: (p) => s.label + ' ' + fmt(p.value, f) } : undefined,
    })),
  };
}

function barOption(f) {
  const s = f.series[0];
  const rows = [...visibleRows(f)].sort((a, b) => b[s.key] - a[s.key]);
  return {
    animation: false,
    textStyle: { fontFamily: getComputedStyle(document.body).fontFamily },
    grid: { left: 8, right: 56, top: 8, bottom: 8, containLabel: true },
    tooltip: { trigger: 'item', ...tooltipStyle(), valueFormatter: (v) => fmt(v, f) },
    xAxis: { type: 'value', ...axisStyle(), axisLabel: { ...axisStyle().axisLabel, formatter: (v) => fmt(v, { digits: 0 }) } },
    yAxis: { type: 'category', inverse: true, data: rows.map((r) => r[f.x]), ...axisStyle(), splitLine: { show: false } },
    series: [{
      name: s.label,
      type: 'bar',
      data: rows.map((r) => r[s.key]),
      barMaxWidth: 18,
      color: token('--series-1'),
      itemStyle: { borderRadius: [0, 4, 4, 0] },
      label: { show: rows.length <= 15, position: 'right', color: token('--text-secondary'), fontSize: 11, formatter: (p) => fmt(p.value, f) },
    }],
  };
}

function tableHtml(f) {
  const cols = f.columns || Object.keys(f.rows[0] || {}).map((key) => ({ key, label: key }));
  const isNum = (c) => c.digits !== undefined || typeof f.rows[0]?.[c.key] === 'number';
  return '<table><thead><tr>' + cols.map((c) => '<th class="' + (isNum(c) ? 'n' : '') + '" scope="col">' + esc(c.label) + '</th>').join('') + '</tr></thead><tbody>' +
    f.rows.map((r) => '<tr>' + cols.map((c) => isNum(c)
      ? '<td class="n">' + esc(fmt(r[c.key], c)) + '</td>'
      : '<td>' + esc(r[c.key]) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

function renderMethod() {
  $('method-title').textContent = UI.methodTitle;
  $('method-text').textContent = REPORT.method;
  $('method-sql').innerHTML = REPORT.figures.map((f) =>
    '<details class="sql"><summary>' + esc(UI.sqlFor(f.title)) + '</summary><pre>' + esc(f.sql.trim()) + '</pre></details>').join('');
}

function renderFooter() {
  $('footer').innerHTML = REPORT.sources.map((s) =>
    '<p><a href="' + esc(SITE + '/datasets/' + s.dataset) + '">' + esc(s.name) + '</a> · ' +
    (s.licenseUrl ? '<a href="' + esc(s.licenseUrl) + '">' + esc(s.license) + '</a>' : esc(s.license)) +
    ' · ' + esc(s.attribution) + '</p>').join('') +
    '<p>' + esc(UI.footer(REPORT.asOf)) + '</p>';
}

function renderAll() {
  renderKpis();
  REPORT.figures.forEach(renderFigure);
}

/* ---- Data out: one menu per figure ---------------------------------------- */

function toCsv(rows) {
  if (!rows.length) return '';
  const cols = Object.keys(rows[0]);
  const cell = (v) => {
    const t = v === null || v === undefined ? '' : String(v);
    return /[",\r\n]|^\s|\s$/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return [cols.join(','), ...rows.map((r) => cols.map((c) => cell(r[c])).join(','))].join('\r\n');
}

// A sandboxed viewer makes <a download> inert. Where the host offers a downloads
// capability (a Claude artifact published with it), save through that instead.
let saver = null;
try { window.claude?.use?.('downloads')?.then((ns) => { saver = ns; }, () => {}); } catch { /* not a Claude viewer */ }
const framed = window.self !== window.top;

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}

async function saveFile(filename, text, type) {
  const blob = new Blob([text], { type });
  if (saver) return saver.save({ filename, data: blob });
  if (framed) {
    if (await copyText(text)) toast(UI.downloadBlocked);
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.dataset.show = '';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => delete t.dataset.show, 2600);
}

document.addEventListener('click', async (event) => {
  document.querySelectorAll('details.menu[open]').forEach((d) => { if (!d.contains(event.target)) d.open = false; });
  const chip = event.target.closest('[data-range]');
  if (chip) {
    const f = figureById(chip.closest('.figure').id.slice(4));
    f.rangeIndex = Number(chip.dataset.range);
    chip.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === chip)));
    renderFigure(f);
    return;
  }
  const action = event.target.closest('[data-act]');
  if (!action) return;
  event.preventDefault();
  const f = figureById(action.closest('.figure').id.slice(4));
  action.closest('details').open = false;
  if (action.dataset.act === 'sql') { if (await copyText(f.sql.trim())) toast(UI.copied); return; }
  const stem = f.id + '-' + REPORT.asOf;
  if (action.dataset.act === 'csv') await saveFile(stem + '.csv', toCsv(f.rows), 'text/csv');
  if (action.dataset.act === 'json') await saveFile(stem + '.json', JSON.stringify(f.rows, null, 2), 'application/json');
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  document.querySelectorAll('details.menu[open]').forEach((d) => { d.open = false; d.querySelector('summary').focus(); });
});

/* ---- Live refresh: the same SQL, run in the reader's browser -------------- */

let connection = null;

async function connect() {
  const duckdb = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@' + ENGINE.npm + '/+esm');
  const worker = await duckdb.createWorker(ENGINE.base + ENGINE.worker);
  const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), worker);
  await db.instantiate(ENGINE.base + ENGINE.wasm);
  const conn = await db.connect();
  // This engine sends httpfs's If-Match header URL-encoded and the bucket answers 412;
  // every file it reads is immutable, so the check guards nothing here.
  await conn.query('SET GLOBAL unsafe_disable_etag_checks = true');
  await conn.query("ATTACH 'ducklake:" + CATALOG + "' AS datadirectory (READ_ONLY)");
  return conn;
}

// Arrow hands BIGINT back as a JS bigint; the page only ever needs plain numbers.
const plain = (row) => Object.fromEntries(Object.entries(row).map(([k, v]) => [k, typeof v === 'bigint' ? Number(v) : v]));

async function refresh() {
  const button = $('refresh');
  button.disabled = true;
  setMode('embedded', UI.refreshing);
  try {
    connection ??= await connect();
    for (const f of REPORT.figures) {
      const result = await connection.query(f.sql);
      f.rows = result.toArray().map((r) => plain(r.toJSON()));
    }
    renderAll();
    setMode('live', UI.live(new Date().toLocaleString(REPORT.locale)));
  } catch (error) {
    // A blocked fetch surfaces as "Cannot open database … read-only mode", which reads like
    // a missing file. Say what actually happened, and keep the embedded figures.
    console.error(error);
    setMode('error', UI.embedded(REPORT.asOf));
    toast(UI.unreachable);
  } finally {
    button.disabled = false;
  }
}

/* ---- Boot ----------------------------------------------------------------- */

renderHeader();
$('figures').innerHTML = REPORT.figures.map(figureShell).join('');
renderAll();
renderMethod();
renderFooter();
$('refresh').addEventListener('click', refresh);
window.addEventListener('resize', () => charts.forEach((c) => c.resize()));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => REPORT.figures.forEach(renderFigure));
</script>
